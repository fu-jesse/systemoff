CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# Print synchronously so the output is out before the device powers off.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# Deprecated symbol, replaced by SOC_SERIES_NRF54L
CONFIG_NRF_PLATFORM_LUMOS=n
